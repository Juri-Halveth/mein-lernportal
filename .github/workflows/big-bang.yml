name: Bash Big Bang checks
on:
  push:
    branches: [main]
    paths: ['big-bang/**', 'curriculum.js', 'tests/big-bang.cjs', '.github/workflows/big-bang.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/big-bang.cjs
